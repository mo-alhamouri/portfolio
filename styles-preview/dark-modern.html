<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark & Modern Style Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            color: #fff;
        }

        header {
            padding: 30px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: -0.5px;
        }

        nav {
            display: flex;
            gap: 40px;
        }

        nav a {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 14px;
            font-weight: 400;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #fff;
        }

        .hero {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 60px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: clamp(48px, 10vw, 120px);
            font-weight: 300;
            line-height: 1;
            letter-spacing: -4px;
            margin-bottom: 30px;
        }

        .hero p {
            font-size: 1.25rem;
            color: rgba(255,255,255,0.5);
            max-width: 500px;
            line-height: 1.6;
            font-weight: 300;
        }

        .accent-line {
            width: 60px;
            height: 2px;
            background: #fff;
            margin: 40px 0;
        }

        .section-preview {
            padding: 80px 60px;
            max-width: 1400px;
            margin: 0 auto;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .section-preview h2 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 50px;
            font-weight: 400;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: rgba(255,255,255,0.1);
        }

        .project-card {
            aspect-ratio: 16/10;
            background: #000;
            position: relative;
            overflow: hidden;
            transition: background 0.3s;
        }

        .project-card:hover {
            background: rgba(255,255,255,0.05);
        }

        .project-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 0;
            background: rgba(255,255,255,0.1);
            transition: height 0.4s ease;
        }

        .project-card:hover::after {
            height: 100%;
        }

        .style-label {
            position: fixed;
            bottom: 40px;
            right: 40px;
            background: rgba(255,255,255,0.1);
            padding: 16px 24px;
            border-radius: 4px;
        }

        .style-label span {
            font-size: 14px;
            font-weight: 400;
            color: #fff;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">Mo Alhamouri</div>
        <nav>
            <a href="#">About</a>
            <a href="#">Work</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Lead Product Designer</h1>
        <div class="accent-line"></div>
        <p>I design thoughtful, data-driven, and scalable user experiences for complex digital ecosystems.</p>
    </section>

    <section class="section-preview">
        <h2>02 — Featured Work</h2>
        <div class="projects-grid">
            <div class="project-card"></div>
            <div class="project-card"></div>
            <div class="project-card"></div>
        </div>
    </section>

    <div class="style-label">
        <span>◼ Dark & Modern Style</span>
    </div>
</body>
</html>
