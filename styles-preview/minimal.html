<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal & Clean Style Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fafafa;
            color: #1a1a1a;
        }

        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: rgba(250, 250, 250, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid #e5e5e5;
            padding: 0 24px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 72px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-weight: 600;
            font-size: 18px;
            color: #1a1a1a;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 32px;
        }

        .nav-links a {
            color: #666;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 24px;
            padding-top: 72px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: clamp(40px, 8vw, 72px);
            font-weight: 500;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 24px;
        }

        .hero p {
            font-size: 20px;
            color: #666;
            max-width: 540px;
            line-height: 1.5;
        }

        .section-preview {
            padding: 120px 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-preview h2 {
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #666;
            margin-bottom: 64px;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
        }

        .project-card {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            overflow: hidden;
        }

        .project-image {
            aspect-ratio: 16 / 10;
            background: #f5f5f5;
        }

        .project-info {
            padding: 24px;
        }

        .project-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .project-desc {
            font-size: 14px;
            color: #666;
        }

        .style-label {
            position: fixed;
            bottom: 40px;
            right: 40px;
            background: #1a1a1a;
            padding: 16px 24px;
            border-radius: 6px;
        }

        .style-label span {
            font-size: 14px;
            font-weight: 500;
            color: #fff;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <a href="#" class="logo">Mo Alhamouri</a>
            <ul class="nav-links">
                <li><a href="#">About</a></li>
                <li><a href="#">Work</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div>
            <h1>Lead Product Designer</h1>
            <p>I design thoughtful, data-driven, and scalable user experiences for complex digital ecosystems.</p>
        </div>
    </section>

    <section class="section-preview">
        <h2>02 — Design Projects</h2>
        <div class="projects-grid">
            <div class="project-card">
                <div class="project-image"></div>
                <div class="project-info">
                    <div class="project-title">AI Driven Designs</div>
                    <div class="project-desc">UI/UX</div>
                </div>
            </div>
            <div class="project-card">
                <div class="project-image"></div>
                <div class="project-info">
                    <div class="project-title">FinTech Dashboard</div>
                    <div class="project-desc">UI/UX</div>
                </div>
            </div>
            <div class="project-card">
                <div class="project-image"></div>
                <div class="project-info">
                    <div class="project-title">HealthTech</div>
                    <div class="project-desc">UI/UX</div>
                </div>
            </div>
        </div>
    </section>

    <div class="style-label">
        <span>○ Minimal & Clean Style</span>
    </div>
</body>
</html>
